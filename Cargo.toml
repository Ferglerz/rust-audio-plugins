[workspace]
members = [
    "chordboard",
    "chordboard/xtask",
    "pleasant-curves",
    "pleasant-dynamics",
    "pleasant-dsp",
    "pleasant-eq",
    "pleasant-ui",
    "Composure_Rust",
    "Composure_Rust/xtask",
    "examples/pleasant-curves-headless",
    "examples/pleasant-dsp-headless",
    "examples/pleasant-eq-headless",
    "Damian Channel Strip",
    "Damian Channel Strip/xtask",
    "Flattery",
    "Flattery/xtask",
    "Tape Stop",
    "Tape Stop/xtask",
    "openwurli-ui",
    "openwurli-ui/xtask",
]
exclude = ["scd-rust"]
resolver = "2"

[patch."https://github.com/RustAudio/baseview.git"]
baseview = { path = "Damian Channel Strip/vendor/baseview" }

[patch."https://github.com/robbert-vdh/nih-plug.git"]
nih_plug = { path = "Damian Channel Strip/vendor/nih-plug" }
nih_plug_vizia = { path = "Damian Channel Strip/vendor/nih-plug/nih_plug_vizia" }

[patch."https://github.com/robbert-vdh/vizia.git"]
vizia_baseview = { path = "Damian Channel Strip/vendor/vizia_baseview" }

[patch.crates-io]
block = { path = "vendor/block-0.1.6" }

[profile.profiling]
inherits = "release"
debug = true
strip = false
