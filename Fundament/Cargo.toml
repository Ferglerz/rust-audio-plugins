[package]
name = "fundament"
version = "0.1.0"
edition = "2021"
authors = ["Fergler"]
license = "GPL-3.0-or-later"
description = "Fundament – polyphonic fundamental tracking, partial cuts, and additive resynthesis"

[lib]
crate-type = ["cdylib", "lib"]

[features]
default = []
debug-alloc = ["nih_plug/assert_process_allocs"]

[dependencies]
nih_plug = { git = "https://github.com/robbert-vdh/nih-plug.git" }
nih_plug_vizia = { git = "https://github.com/robbert-vdh/nih-plug.git" }
pleasant-dsp = { path = "../pleasant-dsp" }
pleasant-ui = { path = "../pleasant-ui" }
atomic_float = "1"
rustfft = "6"

[dev-dependencies]
approx = "0.5"
