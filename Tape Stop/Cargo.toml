[package]
name = "tape_stop"
version = "0.1.0"
edition = "2021"
authors = ["Fergler"]
license = "GPL-3.0-or-later"
description = "Tape Stop on MIDI – 70s Analog Tape Brake Effect"

[lib]
crate-type = ["cdylib", "lib"]

[features]
default = []
debug-alloc = ["nih_plug/assert_process_allocs"]

[dependencies]
nih_plug = { git = "https://github.com/robbert-vdh/nih-plug.git" }
nih_plug_vizia = { git = "https://github.com/robbert-vdh/nih-plug.git" }
pleasant-curves = { path = "../pleasant-curves" }
pleasant-dsp = { path = "../pleasant-dsp" }
pleasant-ui = { path = "../pleasant-ui" }
atomic_float = "1"
crossbeam-queue = "0.3.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
approx = "0.5"

[profile.release]
lto = "fat"
opt-level = 3
strip = "symbols"
codegen-units = 1

[profile.profiling]
inherits = "release"
debug = true
strip = false
