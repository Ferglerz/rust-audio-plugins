[package]
name = "openwurli-dsp"
version = "0.7.0"
edition = "2024"
rust-version = "1.85"
license = "GPL-3.0-or-later"
repository = "https://github.com/hal0zer0/openwurli"
authors = ["hal0zer0"]
description = "Wurlitzer 200A DSP library — modal synthesis, preamp circuit simulation, tremolo, and a framework-agnostic WurliEngine for plugin/CLI/embedded hosts"

[features]
default = ["legacy-power-amp"]
melange-preamp = []
legacy-tremolo = []
legacy-power-amp = []

[lints.rust]
unexpected_cfgs = { level = "allow", check-cfg = ['cfg(melange_precise_exp)'] }
unused_variables = "allow"

[lints.clippy]
needless_range_loop = "allow"
too_many_arguments = "allow"
approx_constant = "allow"
absurd_extreme_comparisons = "allow"
identity_op = "allow"
erasing_op = "allow"
unnecessary_cast = "allow"

[dependencies]
melange-primitives = { git = "https://github.com/hal0zer0/melange", rev = "7ecb36c" }
wide = "0.7"

[dev-dependencies]
hound = "3.5"
midly = "0.5"
