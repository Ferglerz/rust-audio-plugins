[package]
name = "openwurli-ui"
version = "0.1.1"
edition = "2021"
authors = ["Fergler"]
license = "GPL-3.0-or-later"
description = "Pleasant UI wrapper for the OpenWurli electric piano"

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
nih_plug = { git = "https://github.com/robbert-vdh/nih-plug.git" }
nih_plug_vizia = { git = "https://github.com/robbert-vdh/nih-plug.git" }
pleasant-ui = { path = "../pleasant-ui" }
openwurli-dsp = { git = "https://github.com/Ferglerz/openwurli", rev = "ff8a97230fed119acc3b70c5f4ad0f8e0f7ff1d7", features = ["runtime-models"] }
