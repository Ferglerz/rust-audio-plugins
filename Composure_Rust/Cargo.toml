[package]
name = "composure"
version = "0.1.0"
edition = "2021"
authors = ["Fergler"]
license = "GPL-3.0-or-later"
description = "Composure – a curve-based dynamic processor"

[lib]
crate-type = ["cdylib", "lib"]

[features]
default = []
debug-alloc = ["nih_plug/assert_process_allocs"]

[dependencies]
pleasant-ui = { path = "../pleasant-ui" }
pleasant-eq = { path = "../pleasant-eq" }
nih_plug = { git = "https://github.com/robbert-vdh/nih-plug.git" }
nih_plug_vizia = { git = "https://github.com/robbert-vdh/nih-plug.git" }
atomic_float = "1"
arc-swap = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
crossbeam-queue = "0.3.12"

[dev-dependencies]
approx = "0.5"

