[package]
name = "composure"
version = "0.1.0"
edition = "2021"
authors = ["Fergler"]
license = "GPL-3.0-or-later"
description = "Composure – a curve-based dynamic processor"

[workspace]
members = ["xtask"]

[lib]
crate-type = ["cdylib", "lib"]

[features]
default = []
debug-alloc = ["nih_plug/assert_process_allocs"]

[dependencies]
nih_plug = { git = "https://github.com/robbert-vdh/nih-plug.git" }
nih_plug_vizia = { git = "https://github.com/robbert-vdh/nih-plug.git" }
atomic_float = "1"
arc-swap = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
crossbeam-queue = "0.3.12"

[dev-dependencies]
approx = "0.5"

[profile.release]
lto = "fat"
opt-level = 3
strip = "symbols"
codegen-units = 1

[profile.profiling]
inherits = "release"
debug = true
strip = false
